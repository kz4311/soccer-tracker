<!doctype html>
<html lang="ja">
<head>
<link rel="apple-touch-icon" href="./soccer-tracker-icon.png">
<link rel="icon" type="image/png" href="./soccer-tracker-icon.png">
<meta name="apple-mobile-web-app-title" content="SOCCER TRACKER">
<style>
:root{--bg:#101019;--card:#1b1b29;--line:#36364a;--purple:#9a72ff;--green:#35c979;--muted:#a6a5b8;--red:#ff6d7d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#11111c,#171326 55%,#101019);color:#f7f6fb;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}main{width:min(100% - 32px,1280px);margin:auto;padding:24px 0 36px}.brand{text-align:left;letter-spacing:.18em;font-weight:800;color:#cbbaff;font-size:24px;margin:4px 0 18px}.card{background:rgba(28,28,42,.94);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 8px 25px #0003}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}input,select{width:100%;height:44px;border:1px solid #48485d;border-radius:10px;background:#11111a;color:#fff;padding:0 10px;font-size:16px}h2{font-size:15px;margin:3px 0 12px;color:#d9cdfd}.modes{display:flex;gap:8px}.mode{flex:1;height:42px;border:1px solid #55516c;background:#242238;color:#ddd;border-radius:10px;font-size:15px}.mode.active{background:#7049d5;border-color:#b79aff;color:#fff}.periods{display:flex;gap:8px;margin:12px 0}.period{flex:1;height:40px;border:1px solid #4c4b61;border-radius:10px;background:#242432;color:#ddd}.period.active{background:#2d9b68;border-color:#6ce8a0}.period:disabled{opacity:.35}.timer{text-align:center;font-variant-numeric:tabular-nums;font-size:52px;font-weight:800;letter-spacing:.04em;padding:4px}.timer small{display:block;font-size:12px;color:var(--muted);letter-spacing:.08em}.actions{display:flex;gap:9px}.actions button{flex:1;height:48px;border:0;border-radius:12px;color:#06130b;background:var(--green);font-size:16px;font-weight:700}.actions button.stop{background:#f2b34d}.actions button.reset{background:#454457;color:#fff;font-size:13px}.possession{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}.pct{font-size:30px;font-weight:800;color:#c9b8ff}.bar{height:11px;border-radius:8px;background:#454352;overflow:hidden;display:flex;margin:8px 0}.bar i{background:var(--purple);display:block}.bar b{background:#4fbd83;display:block}.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}.team{border:1px solid #3b3b50;border-radius:14px;padding:10px}.team h3{text-align:center;margin:0 0 8px;font-size:16px;color:#d6ccff}.stat{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #323244;padding:9px 0}.stat:first-of-type{border-top:0}.stat span{color:#c3c1ce;font-size:14px}.stat strong{min-width:28px;text-align:center;font-size:20px}.stat button{width:30px;height:28px;border:0;border-radius:8px;background:#4c4a60;color:#fff;font-size:14px}.stat button.plus{width:48px;height:38px;background:#7951dd;font-size:26px;line-height:1}.ended{border-color:#3b9d6d}.note{font-size:12px;color:var(--muted);line-height:1.6}.saved{text-align:right;font-size:11px;color:#78dba4;min-height:16px}.top,.bottom{display:grid;grid-template-columns:1fr 1fr;gap:10px}.top .card,.bottom .card{margin:0}@media(max-width:760px){main{width:min(100%,620px);padding:calc(16px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}.brand{text-align:center;font-size:20px}.top,.bottom{display:block}.top .card,.bottom .card{margin:10px 0}}@media(max-width:380px){.timer{font-size:44px}.grid{grid-template-columns:1fr}}
</style></head><body><main>
<div class="brand">SOCCER TRACKER</div>
<div class="top"><section class="card"><h2>試合時間・形式</h2><div class="grid"><div><label>フルタイム（分）</label><input id="full" type="number" min="1" max="240" step="1" value="40"></div><div><label>試合形式</label><div class="modes"><button class="mode active" data-mode="half">ハーフ制</button><button class="mode" data-mode="single">一本制</button></div></div></div><p class="note" id="formatNote">フルタイムを前半・後半に分割します。</p></section>
<section class="card"><div class="periods"><button class="period active" data-period="1">前半</button><button class="period" data-period="2">後半</button><button class="period" data-period="end">試合終了</button></div><div class="timer"><span id="clock">00:00</span><small id="phaseLabel">前半 / 20分</small></div><div class="actions"><button id="start">自チーム支配 開始</button><button id="stop" class="stop">停止</button><button id="reset" class="reset">試合データ全消去</button></div><div class="saved" id="saved"></div></section></div>
<div class="bottom"><section class="card"><h2>支配率</h2><div class="possession"><div><div class="pct" id="homePct">0%</div><div>自チーム</div></div><div><div class="pct" id="awayPct">0%</div><div>相手チーム</div></div></div><div class="bar"><i id="homeBar" style="width:0%"></i><b id="awayBar" style="width:100%"></b></div><p class="note" id="possTime">自チーム 00:00 / 相手 00:00</p></section>
<section class="card"><h2>スタッツ</h2><div class="teams"><div class="team"><h3>自チーム</h3><div id="homeStats"></div></div><div class="team"><h3>相手チーム</h3><div id="awayStats"></div></div></div></section></div>
<section class="card"><p class="note">入力内容・計測時間・スタッツはこのブラウザに自動保存されます。試合終了を選ぶと表示が固定され、スクリーンショットを撮れます。</p></section>
</main><script>
const $=id=>document.getElementById(id), KEY='soccer-tracker-v1';
let s=JSON.parse(localStorage.getItem(KEY)||'null')||{full:40,mode:'half',period:'1',running:false,startedAt:0,poss:{1:0,2:0,all:0},stats:{1:{home:{shots:0,on:0,corners:0},away:{shots:0,on:0,corners:0}},2:{home:{shots:0,on:0,corners:0},away:{shots:0,on:0,corners:0}}}};
const blankStats=()=>({home:{shots:0,on:0,corners:0},away:{shots:0,on:0,corners:0}});
if(!s.stats||s.stats.home){const old=s.stats||blankStats();s.stats={1:old,2:blankStats()};}
if(!s.stats[1])s.stats[1]=blankStats();if(!s.stats[2])s.stats[2]=blankStats();
$('full').value=s.full;
const save=()=>{localStorage.setItem(KEY,JSON.stringify(s));$('saved').textContent='自動保存済み '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});};
function selected(sel,custom){custom.style.display=sel.value==='custom'?'block':'none'}
['full'].forEach(id=>$(id).onchange=()=>{s[id]=Math.max(1,Number($(id).value)||1);render();save()});
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{s.mode=b.dataset.mode;s.period='1';s.running=false;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x===b));render();save()});
document.querySelectorAll('.period').forEach(b=>b.onclick=()=>{if(s.running){s.poss[cur()]=(s.poss[cur()]||0)+(Date.now()-s.startedAt)/1000;s.running=false}s.period=b.dataset.period;render();save()});
function limit(){return s.mode==='half'?Number(s.full)/2:Number(s.full)} function cur(){return s.period==='2'?2:1} function elapsed(){if(s.period==='end'&&s.mode==='half')return Math.min((s.poss[1]||0)+(s.poss[2]||0),Number(s.full)*60);let e=s.poss[cur()]||0;if(s.running)e+=(Date.now()-s.startedAt)/1000;return Math.min(e,limit()*60)}
function fmt(x){x=Math.max(0,Math.round(x));return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}
function displayedStats(){if(s.period!=='end')return s.stats[cur()];let out=blankStats();[1,2].forEach(p=>['home','away'].forEach(t=>['shots','on','corners'].forEach(k=>out[t][k]=(s.stats[p][t][k]||0)+(out[t][k]||0))));return out}
function render(){document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===s.mode));document.querySelectorAll('.period').forEach(b=>{b.style.display=s.mode==='single'&&b.dataset.period==='2'?'none':'';b.classList.toggle('active',b.dataset.period===s.period);b.disabled=false});let e=elapsed(), max=s.period==='end'&&s.mode==='half'?Number(s.full)*60:limit()*60; $('clock').textContent=fmt(e);$('phaseLabel').textContent=s.period==='end'?'試合終了':(s.mode==='half'?(s.period==='1'?'前半':'後半'):'試合中')+' / '+limit()+'分';let p=Math.min(100,e/max*100);$('homePct').textContent=Math.round(p)+'%';$('awayPct').textContent=Math.round(100-p)+'%';$('homeBar').style.width=p+'%';$('awayBar').style.width=(100-p)+'%';$('possTime').textContent='自チーム '+fmt(e)+' / 相手 '+fmt(max-e);$('start').textContent=s.running?'自チーム支配 中':'自チーム支配 開始';$('start').disabled=s.period==='end'||e>=max;$('stop').disabled=!s.running;let shown=displayedStats();draw('homeStats','home',shown);draw('awayStats','away',shown)}
function draw(id,t,data){$(id).innerHTML=[['shots','シュート'],['on','枠内シュート'],['corners','コーナー']].map(([k,n])=>`<div class="stat"><span>${n}</span><button onclick="change('${t}','${k}',-1)">−</button><strong>${data[t][k]}</strong><button class="plus" onclick="change('${t}','${k}',1)">＋</button></div>`).join('')}
window.change=(t,k,d)=>{if(s.period==='end')return;s.stats[cur()][t][k]=Math.max(0,s.stats[cur()][t][k]+d);render();save()};$('start').onclick=()=>{if(!s.running){s.running=true;s.startedAt=Date.now();render();save()}};$('stop').onclick=()=>{if(s.running){s.poss[cur()]=(s.poss[cur()]||0)+(Date.now()-s.startedAt)/1000;s.running=false;render();save()}};$('reset').onclick=()=>{if(confirm('タイマー・支配時間・スタッツをすべて消去します。よろしいですか？')){s.running=false;s.startedAt=0;s.period='1';s.poss={1:0,2:0,all:0};s.stats={1:blankStats(),2:blankStats()};render();save()}};setInterval(()=>{if(s.running){render()}},500);render();
</script></body></html>
